spring:
  application:
    name: SignSpeakBackend

server:
  port: 8080
  address: 0.0.0.0


ml:
  system:
    url: http://host.docker.internal:8000/api/predict_landmarks #Link to ml system

frame:
  selection:
    count: 30

buffer:
  max:
    size: 120        # Trigger evacuation at this size
  evacuate:
    count: 80   # Send this many oldest frames
  retain:
    count: 40     # Keep this many newest frames

logging:
  level:
    com.example.SignSpeakBackend: INFO
    org.springframework.web.socket: DEBUG

#Enabling swagger ui
springfox:
  documentation:
    swagger-ui:
      enabled: true

#Custom path
#springdoc.api-docs.path=/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui-custom.html