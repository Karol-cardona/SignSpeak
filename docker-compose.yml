version: '3.8'

services:

  signspeak-ml:
    build:
      context: ./SignSpeakBackend-Python
      dockerfile: Dockerfile
    container_name: signspeak-ml
    env_file:
      - ./SignSpeakBackend-Python/.env
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - GGML_CUDA=1
    volumes:
      - ./SignSpeakBackend-Python:/app
      - ./local_model:/app/local_model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # O 'all'
              capabilities: [gpu]

  signspeak-backend:
    build:
      context: ./SignSpeakBackend
      dockerfile: Dockerfile
    container_name: signspeak-backend
    ports:
      - "8080:8080"
    environment:
      - ML_SYSTEM_URL=http://signspeak-ml:8000/api/predict_landmarks # Added for proper communication with ML service - change if needed
    depends_on:
      - signspeak-ml

#  signspeak-frontend:
#    build:
#      context: ./signspeak-frontend
#      dockerfile: Dockerfile
#    container_name: signspeak-frontend
#    ports:
#      - "5173:80"
#    depends_on:
#      - signspeak-backend

  signspeak-frontend:
    build:
      context: ./signspeak-frontend
      dockerfile: Dockerfile.dev
    container_name: signspeak-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./signspeak-frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - signspeak-backend
